apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-config-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-config

  template:
    metadata:
      labels:
        app: flask-config

    spec:

      containers:
      - name: flask-app
        image: hmanojbabu/flask-configmap:v4

        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: flask-config
              key: APP_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: flask-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flask-secret
              key: DB_PASSWORD

        ports:
        - containerPort: 5000

        volumeMounts:
        - mountPath: /data
          name: app-storage

      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: flask-pvc
